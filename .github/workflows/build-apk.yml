name: Build Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm install
        working-directory: ludora-mobile

      - run: npx cap add android
        working-directory: ludora-mobile

      - run: npx capacitor-assets generate --android --assetPath assets
        working-directory: ludora-mobile
        continue-on-error: true   # keeps the default icon if this step fails

      - run: npx cap sync android
        working-directory: ludora-mobile

      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ludora-mobile/android

      - run: cp ludora-mobile/android/app/build/outputs/apk/debug/app-debug.apk ludora.apk

      - uses: actions/upload-artifact@v4
        with: { name: ludora-apk, path: ludora.apk }

      - name: Publish APK as a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ludora APK build ${{ github.run_number }}
          files: ludora.apk
